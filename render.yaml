# Render blueprint — create everything in one step with "New > Blueprint"
# and point it at this repository.
services:
  - type: web
    name: bodybank-beta-tracker
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bodybank-tracker-db
          property: connectionString
      # Render generates this on first deploy and keeps it stable afterwards.
      - key: JWT_SECRET
        generateValue: true
      # Render asks for the password when you apply the blueprint. The account
      # is created from these two on startup, so nothing else is needed; the
      # free plan has no shell to run a setup command from.
      - key: DEVELOPER_EMAIL
        value: dinesh@bodybank.fit
      - key: DEVELOPER_PASSWORD
        sync: false

databases:
  - name: bodybank-tracker-db
    databaseName: bodybank_tracker
    user: bodybank
    plan: free
