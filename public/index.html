<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · bodybank beta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="signin-wrap">
    <div class="signin">
      <div class="brand">
        <h1>bodybank<span style="font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:4px;margin-left:8px;vertical-align:3px;">beta</span></h1>
        <p>Report bugs, track fixes, retest.</p>
      </div>

      <div class="card">
        <div class="card-body">
          <div id="message" class="alert"></div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" autofocus>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password">
          </div>
          <button class="btn btn-primary btn-block btn-lg" id="submit">Sign in</button>
        </div>
      </div>

      <p class="signin-foot">Testers: Dinesh sets up your account and sends your password.</p>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
