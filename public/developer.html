<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All tickets · bodybank beta</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app">
  <header class="sidebar" id="topbar"></header>

  <main class="page">
    <div class="page-head">
      <div>
        <div class="crumb">bodybank.fit beta</div>
        <h1>Beta board</h1>
        <p>Everything the testers have reported, and what needs you next.</p>
      </div>
    </div>

    <div id="attention"></div>

    <section class="stats" id="stats" aria-label="Ticket counts"></section>

    <div class="section-title">
      <h2>Overview</h2>
      <span class="aside">Across all tickets, whatever the filters below say</span>
    </div>

    <div class="cols cols-wide-narrow">
      <section class="card">
        <div class="card-head"><h2>Where the tickets stand</h2></div>
        <div class="card-body"><div id="status-chart"></div></div>
      </section>

      <section class="card">
        <div class="card-head"><h2>By priority</h2></div>
        <div class="card-body"><div id="priority-chart"></div></div>
      </section>
    </div>

    <div class="cols cols-2" style="margin-top:16px;">
      <section class="card">
        <div class="card-head">
          <h2>Most affected modules</h2>
          <span class="aside" style="font-size:12px;color:var(--subtle);">Top 6</span>
        </div>
        <div class="card-body"><div id="module-chart"></div></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Waiting longest</h2>
          <span class="aside" style="font-size:12px;color:var(--subtle);">Still open</span>
        </div>
        <div id="oldest"></div>
      </section>
    </div>

    <div class="section-title">
      <h2>All tickets</h2>
      <span class="aside" id="result-count"></span>
    </div>

    <section class="card">
      <div class="card-head">
        <div class="tabs" id="tabs"></div>
        <div class="filters">
          <input type="search" id="search" placeholder="Search title, key, tester" aria-label="Search tickets">
          <select id="module" aria-label="Filter by module"></select>
          <select id="priority" aria-label="Filter by priority"></select>
        </div>
      </div>
      <div id="list"></div>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/developer.js"></script>
</body>
</html>
